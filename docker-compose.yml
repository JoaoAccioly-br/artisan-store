services:
  postgres:
    image: postgres:16-alpine
    container_name: doceria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doceria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doceria_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-doceria}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doceria} -d ${POSTGRES_DB:-doceria}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
